[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-url-detection"
version = "0.1.0"
description = "Machine-learning core for phishing URL detection"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "xgboost",
  "joblib",
  "requests",
  "python-whois",
  "scipy",
  "flask",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
